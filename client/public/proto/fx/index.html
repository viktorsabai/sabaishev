:root{--bg:#09090b;--bg2:#141418;--fg:#f2f0ec;--mut:#a7a39b;--line:#2a2a30;--o:#ff7a12;--p:#8b5cf6;--g:linear-gradient(100deg,#ff7a12,#e8458b 55%,#8b5cf6);--r:14px;--disp:Anton,OswaldCyr,Impact,'Arial Narrow',sans-serif;--bc:'Barlow Condensed',OswaldCyr,'Arial Narrow',sans-serif;--mono:'JetBrains Mono',ui-monospace,Menlo,monospace;--ease:cubic-bezier(.2,.8,.2,1)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;font-synthesis:none}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.55 -apple-system,'SF Pro Text','Segoe UI',Inter,Roboto,sans-serif;overflow-x:hidden}
html[lang=th] body{font-family:'Noto Sans Thai',-apple-system,sans-serif}
html[lang=th] h1.hh,html[lang=th] h2,html[lang=th] .hf h3,html[lang=th] .D{font-family:'Noto Sans Thai',sans-serif;font-weight:800;letter-spacing:0;line-height:1.15}
html[lang=th] h1.hh{font-size:min(11vh,9vw)}
.gt{background:var(--g);-webkit-background-clip:text;background-clip:text;color:transparent}
a{color:inherit}button{font:inherit;color:inherit;cursor:pointer}
.mono{font:400 12px/1.4 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--mut)}
.sp{flex:1}
/* header */
header{position:fixed;inset:0 0 auto;z-index:30;padding-top:env(safe-area-inset-top);background:linear-gradient(#09090bd9,#09090b00);pointer-events:none;transition:background .3s}body.sc header{background:rgba(9,9,11,.96);border-bottom:1px solid #ffffff14}
header .hw{display:flex;align-items:center;gap:14px;height:68px;padding:0 max(22px,3.4vw);pointer-events:auto}
.logo{display:flex;align-items:center;text-decoration:none;margin-right:18px}
.logo b{font:400 32px/1 var(--disp);letter-spacing:.02em}.logo b i{font-style:normal;background:var(--g);-webkit-background-clip:text;background-clip:text;color:transparent}
.nv{display:flex;gap:30px}.nv a{font:600 15px var(--bc);letter-spacing:.16em;text-transform:uppercase;text-decoration:none;color:#d8d4cc;transition:color .2s}.nv a:hover{color:#fff}
/* segmented controls: sliding thumb */
.seg{position:relative;display:inline-flex;padding:3px;background:#0a0a0cd9;border:1px solid #ffffff26;isolation:isolate}
.seg .th{position:absolute;z-index:-1;top:3px;bottom:3px;left:0;width:var(--w,0px);transform:translateX(var(--x,0px));background:var(--fg);transition:transform .5s var(--ease),width .5s var(--ease),background .4s}
.seg button{position:relative;border:0;background:none;font:700 11px var(--mono);letter-spacing:.12em;padding:8px 11px;color:#ffffffa6;text-transform:uppercase;transition:color .3s}
.seg button:hover{color:#fff}.seg button.on{color:#0a0a0a}
.seg .th:not([style]){opacity:0}
/* buttons */
.btn{--cut:13px;position:relative;display:inline-flex;align-items:center;justify-content:center;gap:12px;height:56px;padding:0 28px;border:0;border-radius:0;font:700 16px var(--bc);letter-spacing:.16em;text-transform:uppercase;text-decoration:none;color:#fff;overflow:hidden;isolation:isolate;clip-path:polygon(0 0,calc(100% - var(--cut)) 0,100% var(--cut),100% 100%,var(--cut) 100%,0 calc(100% - var(--cut)));transition:transform .3s var(--ease),filter .3s;will-change:transform}
.btn:before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(100deg,#0000 35%,#ffffff59 50%,#0000 65%);transform:translateX(-130%);transition:transform .8s var(--ease)}
.btn:hover:before{transform:translateX(130%)}
.btn:after{content:"";width:18px;height:2px;background:currentColor;flex:none;transition:width .35s var(--ease);box-shadow:none}
.btn:hover:after{width:30px}
.btn:active{transform:scale(.98)}
.btn.p{background:var(--g)}
.btn.cta{background:var(--fg);color:#0a0a0a}
.btn.s{background:none;clip-path:none;color:var(--fg);padding:0 2px;border-bottom:2px solid #f2f0ec40;transition:border-color .3s,transform .3s}.btn.s:hover{border-color:var(--o)}
.btn.sm{height:42px;padding:0 18px;font-size:14px;--cut:9px}
.btn.sm:after{display:none}
/* header tool buttons */
.tbtn{position:relative;display:inline-flex;align-items:center;gap:9px;height:42px;padding:0 15px;border:1px solid #ffffff2e;background:#0a0a0cd9;font:700 12px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:#e8e4dc;text-decoration:none;white-space:nowrap;transition:background .3s,color .3s,border-color .3s}
.tbtn svg{width:17px;height:17px;flex:none}.tbtn:hover{background:var(--fg);color:#0a0a0a;border-color:var(--fg)}
.tbtn b{display:none;position:absolute;right:-5px;top:-6px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--g);color:#fff;font:700 10px/18px var(--mono);text-align:center;letter-spacing:0}.tbtn b.on{display:block;animation:bmp .6s cubic-bezier(.2,1.8,.4,1)}
@keyframes bmp{from{transform:scale(0)}}
#buy:after{content:"→";font-family:var(--mono)}
/* curtain */
#cur{position:fixed;inset:0;z-index:100;background:#09090b;display:grid;place-items:center;transition:transform .95s var(--ease) .1s;animation:cu 0s 5s forwards}
@keyframes cu{to{visibility:hidden}}
#cur b{font:400 clamp(90px,16vw,200px)/1 var(--disp)}#cur b i{font-style:normal;background:var(--g);-webkit-background-clip:text;background-clip:text;color:transparent}
#cur .mono{position:absolute;bottom:34px;left:50%;transform:translateX(-50%)}
body.go #cur{transform:translateY(-101%)}
/* scene */
#scene{position:relative;height:300vh;--p:0;--gl:#ff7a1255;--sg:linear-gradient(100deg,#ff9a2e,#ff5d00 70%,#d9440a)}
#scene[data-g=power]{--gl:#8b5cf666;--sg:linear-gradient(100deg,#a78bfa,#7c4ff0 70%,#5a2fd0)}
#scene[data-g=gold]{--gl:#d9468b55;--sg:linear-gradient(100deg,#ff7a12,#e8458b 55%,#8b5cf6)}
.pin{position:sticky;top:0;height:100svh;min-height:600px;overflow:hidden;display:grid;grid-template-columns:.9fr 1.1fr;align-items:center;gap:2vw;padding:76px max(24px,3.4vw) 22px}
.bgG{position:absolute;inset:0;overflow:hidden;background:radial-gradient(40% 60% at 98% 100%,#8b5cf655,transparent 70%),linear-gradient(#09090b,#0d0d11)}
.bgG:before{content:"";position:absolute;left:40%;right:-12%;top:-8%;height:75%;background:radial-gradient(closest-side,var(--gl),transparent);transform:translate3d(0,calc(var(--p,0)*52%),0);will-change:transform;transition:opacity .6s}
.spot{position:absolute;left:0;top:0;width:640px;height:640px;margin:-320px 0 0 -320px;background:radial-gradient(closest-side,#ffffff14,transparent);pointer-events:none;transform:translate3d(70vw,40vh,0);will-change:transform}
.grain{display:none}
.numw{position:absolute;right:-1vw;top:52%;transform:translateY(-50%);font:400 min(80vh,50vw)/.8 var(--disp);color:transparent;-webkit-text-stroke:1.5px #ffffff17;pointer-events:none;letter-spacing:-.03em}
.numw.rl{animation:rl .5s var(--ease)}@keyframes rl{from{opacity:.2;transform:translateY(-44%)}}
.hl{position:relative;z-index:2;min-width:0}
.chip{display:inline-flex;align-items:center;gap:9px;border:1px solid #ffffff2a;background:#0007;padding:7px 14px;font:400 11px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:#d8d4cc}
.chip i{width:8px;height:8px;border-radius:50%;background:#777}.chip.on i{background:#4ade80;animation:pu 1.8s infinite}@keyframes pu{0%{box-shadow:0 0 0 0 #4ade80aa}70%,100%{box-shadow:0 0 0 9px #4ade8000}}
h1.hh{margin:16px 0 0;font:400 min(15.5vh,11vw)/.88 var(--disp);text-transform:uppercase;letter-spacing:-.005em}
h1.hh .ln{display:block;overflow:hidden;padding-bottom:.05em}
h1.hh .ln>span{display:inline-block;transform:translateY(108%);transition:transform 1.1s var(--ease)}
body.go h1.hh .ln>span{transform:none}h1.hh .ln:nth-child(2)>span{transition-delay:.12s}h1.hh .ln:nth-child(3)>span{transition-delay:.24s}
h1.hh .o{-webkit-text-stroke:2px var(--fg);color:transparent;background:linear-gradient(90deg,var(--fg) calc(var(--p)*160%),transparent calc(var(--p)*160%));-webkit-background-clip:text;background-clip:text;padding-right:.04em}
h1.hh .g{background:var(--g);-webkit-background-clip:text;background-clip:text;color:transparent;padding-right:.04em}
.hs{margin:20px 0 0;max-width:30em;font:600 clamp(18px,2.2vh,24px)/1.2 var(--bc);letter-spacing:.05em;text-transform:uppercase;color:#d8d4cc}
.hb{display:flex;flex-wrap:wrap;gap:12px;margin-top:24px}
.rc{position:relative;z-index:2;display:flex;flex-direction:column;gap:12px;width:100%;max-width:760px;justify-self:end;min-width:0}
.gtabs{display:none;align-self:flex-start}
.gtabs button{display:flex;align-items:center;gap:8px;padding:11px 16px}
.gtabs button i{width:8px;height:8px;border-radius:50%;flex:none}.gtabs button[data-g=one] i{background:var(--o)}.gtabs button[data-g=power] i{background:#8b5cf6}.gtabs button[data-g=gold] i{background:var(--g)}
.gtabs .th[data-g=one]{background:var(--o)}.gtabs .th[data-g=power]{background:#8b5cf6}.gtabs .th[data-g=gold]{background:var(--g)}
.gtabs button.on{color:#fff}.gtabs button.on i{background:#fff!important}
.stw{position:relative;padding:40px 0 0 0;--ph:clamp(34px,6.5vh,64px);--nz:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='260' height='260'><filter id='n'><feTurbulence baseFrequency='.85' numOctaves='3' seed='4'/><feColorMatrix values='0 0 0 0 .6 0 0 0 0 .6 0 0 0 0 .6 0 0 0 .9 0'/></filter><rect width='260' height='260' filter='url(%23n)'/></svg>")}
.stack{position:relative;z-index:2;display:flex;flex-direction:column;gap:3px}
.rod{position:absolute;top:0;bottom:-30px;width:15px;z-index:1;background:linear-gradient(90deg,#1a1a1c,#b5b5bd 40%,#6d6d74 60%,#18181a)}
.rod.l{left:7%}.rod.r{right:7%}
.cable{position:absolute;left:calc(50% - 1.5px);bottom:100%;height:60vh;width:3px;background:linear-gradient(#0000,#9a9aa3)}
.pl{position:relative;height:var(--ph);display:flex;align-items:center;padding:0 3.4% 0 4%;border:0;border-radius:3px;text-align:left;
 background-image:var(--nz),linear-gradient(180deg,#6a6a70 0,#3a3a3f 4%,#1c1c1f 14%,#131315 70%,#0a0a0b 100%);background-blend-mode:overlay,normal;
 box-shadow:inset 0 1px 0 #ffffff60,inset 0 -3px 0 #000,inset 3px 0 0 #ffffff10,0 10px 20px #000d;
 transition:transform .8s cubic-bezier(.3,1.35,.5,1),box-shadow .5s,filter .4s;animation:drop 1.1s cubic-bezier(.2,1.15,.4,1) backwards;animation-delay:calc(var(--k)*70ms + .5s)}
@keyframes drop{from{transform:translateY(-120vh) rotate(-2deg)}}
.pl .n{font:700 clamp(12px,1.7vh,15px) var(--mono);color:#8d8d93;letter-spacing:.08em;width:2.6em;text-transform:uppercase}
.hole{position:absolute;left:44%;top:50%;width:clamp(16px,3.1vh,26px);height:clamp(16px,3.1vh,26px);margin:calc(clamp(16px,3.1vh,26px)/-2) 0 0 calc(clamp(16px,3.1vh,26px)/-2);border-radius:50%;background:radial-gradient(circle at 50% 40%,#000 0,#050506 55%,#2a2a2e 100%);box-shadow:inset 0 2px 3px #000,0 1px 0 #ffffff55,0 -1px 0 #00000099}
.pl .tt{margin-left:auto;font:400 clamp(20px,4.7vh,42px)/1 var(--disp);letter-spacing:.045em;text-transform:uppercase;color:#dedcd6;text-shadow:0 -1px 0 #000,0 1px 0 #ffffff26;transition:color .4s}
.pl .pr{min-width:5.4em;text-align:right;margin-left:2.2%;font:700 clamp(12px,1.9vh,16px) var(--mono);color:#7f7f86;letter-spacing:.02em}
.pl .pop{display:none}
.pl[data-i="3"] .pop{display:block;position:absolute;left:4%;bottom:5px;font:400 9px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:#ffb067;font-style:normal}
.pl:hover{filter:brightness(1.22)}
.pl.up{transform:translateY(calc(var(--ph)*-.52))}
.pl.sel{box-shadow:inset 0 1px 0 #ffffffa0,inset 0 -3px 0 #000,0 0 0 1px var(--gl),0 0 80px var(--gl),0 10px 24px #000d;filter:brightness(1.12)}
.pl.sel .tt{background:var(--sg);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none}
.pl.sel .pr,.pl.sel .n{color:#fff}
.pl.sel .hole:after{content:"";position:absolute;left:50%;bottom:55%;width:clamp(5px,.9vh,8px);height:calc(var(--ph)*1.15);margin-left:calc(clamp(5px,.9vh,8px)/-2);border-radius:4px;background:linear-gradient(90deg,#6b6b72,#fff 45%,#8c8c94);transform-origin:50% 100%;transform:rotate(19deg);box-shadow:0 2px 6px #000b;animation:pin .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes pin{from{transform:rotate(60deg) translateY(30%);opacity:0}}
.pl.cl{animation:clank .5s cubic-bezier(.3,1.6,.5,1)}@keyframes clank{0%{transform:translateY(-10px)}45%{transform:translateY(4px)}100%{transform:none}}
.bb{display:flex;align-items:center;justify-content:space-between;gap:14px;border-top:1px solid #ffffff2a;padding-top:12px}
.bb>div{display:flex;flex-direction:column;min-width:0}
#bp{font:400 clamp(40px,7vh,64px)/1 var(--disp);letter-spacing:-.005em}
.bdd{font:400 12px var(--mono);letter-spacing:.1em;color:#a7a39b;text-transform:uppercase}
.scr{position:absolute;left:50%;transform:translateX(-50%);bottom:18px;z-index:3;display:flex;align-items:center;gap:12px;font:400 11px var(--mono);letter-spacing:.2em;text-transform:uppercase;color:#a7a39b;transition:opacity .4s}
.scr i{width:1px;height:34px;background:linear-gradient(var(--fg),transparent);animation:sc 1.6s ease-in-out infinite;transform-origin:top}@keyframes sc{0%{transform:scaleY(0)}60%{transform:scaleY(1)}100%{transform:scaleY(1);opacity:0}}
/* marquee */
.mq{overflow:hidden;border-block:1px solid #ffffff1c;padding:14px 0;background:#09090b}
.mqt{display:flex;white-space:nowrap;width:max-content;will-change:transform;font:400 clamp(70px,9vw,150px)/1 var(--disp);text-transform:uppercase}
.mqt span{padding:0 2.2vw;color:transparent;-webkit-text-stroke:1.5px #f2f0ec88}.mqt span.f{background:var(--g);-webkit-background-clip:text;background-clip:text;-webkit-text-stroke:0}.mqt i{font-style:normal;color:var(--o);align-self:center;font-size:.5em}
/* gyms */
#gyms{display:grid;grid-template-columns:1fr 1fr;min-height:100vh;transition:grid-template-columns .9s var(--ease);position:relative}
#gyms:has(.hf.a:hover){grid-template-columns:1.45fr .55fr}#gyms:has(.hf.b:hover){grid-template-columns:.55fr 1.45fr}
.hf{position:relative;overflow:hidden;min-height:100vh;padding:48px max(24px,3.4vw);display:flex;flex-direction:column;justify-content:flex-end;min-width:0}
.hf.a{background:radial-gradient(80% 80% at 30% 100%,#ff7a12,#8a2f05 45%,#150a04 85%)}
.hf.b{background:radial-gradient(80% 80% at 70% 100%,#8b5cf6,#32207a 45%,#0b0816 85%)}
.hf .ss{position:absolute;inset:0;overflow:hidden}
.hf .ss img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transform:scale(1.14);filter:grayscale(.85) contrast(1.15) brightness(.7);transition:opacity 1.3s var(--ease),filter .7s}
.hf .ss img.on{opacity:1;animation:kb 7s linear forwards}
@keyframes kb{from{transform:scale(1.14)}to{transform:scale(1.02)}}
.hf:hover .ss img{filter:grayscale(.1) contrast(1.1) brightness(.85)}
.hf .ss:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#0000 20%,#000c 100%),linear-gradient(90deg,var(--tint),#0000 70%);mix-blend-mode:normal}
.hf.a{--tint:#ff7a1255}.hf.b{--tint:#8b5cf655}
.sdots{position:absolute;right:max(24px,3.4vw);top:96px;display:flex;gap:6px;z-index:3}
.sdots i{width:22px;height:3px;background:#ffffff40;overflow:hidden;position:relative}
.sdots i.on:after{content:"";position:absolute;inset:0;background:#fff;transform-origin:left;animation:sd 3.4s linear forwards}
@keyframes sd{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.hf .nm{position:absolute;right:20px;top:-2vw;font:400 min(46vw,560px)/.8 var(--disp);color:#ffffff12;pointer-events:none;transform:translateY(calc(var(--gp,0)*60px))}
.hf .mono{position:relative;color:#ffffffd0}
.hf h3{position:relative;margin:14px 0 18px;font:400 clamp(88px,13vw,230px)/.9 var(--disp);text-transform:uppercase;transform:translateY(calc((.5 - var(--gp,.5))*70px));text-shadow:0 10px 60px #0008}
.hf p{position:relative;max-width:22em;margin:0 0 22px;font:600 clamp(20px,2vw,26px)/1.2 var(--bc);letter-spacing:.05em;text-transform:uppercase;color:#fff}
.hf .btn{position:relative;align-self:flex-start}
/* gallery: pinned, structured */
#look{position:relative;height:380vh;background:#09090b}
#look .st{position:sticky;top:0;height:100svh;overflow:hidden;display:grid;grid-template-columns:5fr 7fr;gap:4vw;align-items:center;padding:84px max(24px,3.4vw) 56px}
.gl-l{min-width:0;display:flex;flex-direction:column;height:100%;justify-content:center}
.gl-l .mono{color:var(--o)}
.gl-l h2{margin:12px 0 4vh;font:400 clamp(60px,7.6vw,128px)/.9 var(--disp);text-transform:uppercase}.gl-l h2 .o2{display:block;color:transparent;-webkit-text-stroke:2px var(--fg)}
.gl-idx{list-style:none;margin:0;padding:0;border-bottom:1px solid #ffffff1c}
.gl-idx li{display:grid;grid-template-columns:3.2em 1fr auto;gap:12px;align-items:baseline;padding:clamp(9px,1.6vh,15px) 0;border-top:1px solid #ffffff1c;cursor:pointer;color:#6e6c68;transition:color .35s,padding .35s;position:relative}
.gl-idx li:before{content:"";position:absolute;left:0;top:-1px;height:2px;width:0;background:var(--g);transition:width .6s var(--ease)}
.gl-idx li.on{color:var(--fg);padding-left:10px}.gl-idx li.on:before{width:100%}
.gl-idx .gn{font:400 12px var(--mono);letter-spacing:.1em}.gl-idx .gt2{font:600 clamp(18px,2.8vh,26px) var(--bc);letter-spacing:.08em;text-transform:uppercase}.gl-idx .gg{font:400 11px var(--mono);letter-spacing:.12em;text-transform:uppercase}
.gl-idx li.o.on .gg{color:var(--o)}.gl-idx li.p.on .gg{color:#a78bfa}
.gl-r{min-width:0;display:flex;flex-direction:column;gap:12px;height:100%;justify-content:center}
.gl-frame{position:relative;overflow:hidden;background:#16161e;height:min(66vh,calc(100% - 96px));width:100%}
.gl-frame img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transform:scale(1.08);filter:saturate(.45) contrast(1.12) brightness(.85);transition:opacity .8s var(--ease),transform 1.6s var(--ease),filter .6s;clip-path:inset(0 0 0 0)}
.gl-frame img.on{opacity:1;transform:none}
.gl-frame:hover img.on{filter:none}
.gl-frame:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#0000 55%,#000b);pointer-events:none}
.gl-cap{position:absolute;left:18px;right:18px;bottom:16px;z-index:2;display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.gl-cap b{font:400 clamp(28px,4.2vh,44px)/1 var(--disp);text-transform:uppercase}.gl-cap span{font:400 12px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:#d8d4cc}
.gl-th{display:grid;grid-template-columns:repeat(8,1fr);gap:8px}
.gl-th button{position:relative;aspect-ratio:4/3;border:0;padding:0;background:#16161e;overflow:hidden;opacity:.45;transition:opacity .3s}
.gl-th button.on{opacity:1;outline:2px solid var(--fg);outline-offset:2px}.gl-th button:hover{opacity:.9}
.gl-th img{width:100%;height:100%;object-fit:cover;display:block;filter:grayscale(1)}
.pbar{position:absolute;left:max(24px,3.4vw);right:max(24px,3.4vw);bottom:26px;height:2px;background:#ffffff22}.pbar i{display:block;height:100%;width:calc(var(--lp,0)*100%);background:var(--g)}
/* how */
#how{padding:15vh max(24px,3.4vw) 11vh;position:relative}
.hd{font:400 clamp(60px,9.5vw,170px)/.9 var(--disp);text-transform:uppercase;margin:12px 0 0;max-width:12em}
.hd .gt{display:inline-block}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:3vw;margin-top:8vh}
.step{position:relative;padding-top:26px}
.step:before{content:"";position:absolute;left:0;top:0;height:2px;width:100%;background:var(--g);transform:scaleX(0);transform-origin:left;transition:transform 1.3s var(--ease) .15s}.step.in:before{transform:none}
.step .nn{font:400 clamp(90px,10vw,160px)/.9 var(--disp);color:transparent;-webkit-text-stroke:1.5px #f2f0ec66;transition:color .6s .4s,-webkit-text-stroke-color .6s .4s}.step.in .nn{background:var(--g);-webkit-background-clip:text;background-clip:text;-webkit-text-stroke:0}
.step h3{margin:14px 0 8px;font:700 34px/1 var(--bc);letter-spacing:.06em;text-transform:uppercase}.step p{margin:0;color:var(--mut);max-width:24em}
/* visit */
#visit{padding:6vh max(24px,3.4vw) 14vh;display:grid;grid-template-columns:1.1fr 1fr;gap:3vw;align-items:stretch}
.vp{position:relative;overflow:hidden;min-height:62vh;background:#16161e}
.vp img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:grayscale(1) contrast(1.15) brightness(.8);transition:filter .8s}.vp:hover img{filter:none}
.vp:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#0000 50%,#000c)}
.vp .mono{position:absolute;left:18px;bottom:16px;z-index:2;color:#fff}
.vi{display:flex;flex-direction:column;justify-content:center;min-width:0}
.vi .hd{font-size:clamp(56px,7vw,120px)}
.hrs{margin-top:4vh;border-top:1px solid #ffffff2a}.hrs div{display:flex;justify-content:space-between;align-items:baseline;padding:16px 0;border-bottom:1px solid #ffffff1a;gap:10px}
.hrs b{font:700 clamp(26px,3vw,40px)/1 var(--bc);letter-spacing:.08em;text-transform:uppercase}
.vi .ph2{font:700 clamp(30px,3.4vw,48px)/1.1 var(--bc);letter-spacing:.06em;text-decoration:none;display:inline-block;margin-top:3vh}
.vi p{color:var(--mut);margin:8px 0 0}.vi a.mp{color:var(--o)}
/* team */
#team{margin:0 max(24px,3.4vw) 12vh;position:relative;overflow:hidden;padding:clamp(32px,5vw,72px);background:linear-gradient(135deg,#ff7a1220,#8b5cf622);border:1px solid #ffffff1f;display:grid;grid-template-columns:1.1fr 1fr;gap:3vw;align-items:center}
#team .hd{font-size:clamp(56px,7.4vw,130px)}
#team p{color:#d8d4cc;max-width:26em;margin:20px 0 28px}
.phs{position:relative;height:520px;min-width:0}
.phn{position:absolute;width:250px;height:510px;border-radius:38px;background:#0b0b0e;border:2px solid #ffffff30;box-shadow:0 40px 90px #000c,0 0 0 7px #151519;padding:20px 15px;overflow:hidden}
.phn.a{left:6%;top:0;transform:translateY(calc((.5 - var(--tp,.5))*80px)) rotate(-4deg)}.phn.b{left:48%;top:50px;transform:translateY(calc((.5 - var(--tp,.5))*-60px)) rotate(3deg)}
.phn .h{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.phn .h b{font:400 22px var(--disp)}
.phn .qq{width:170px;height:170px;margin:6px auto 10px;background:#fff;border-radius:6px;padding:10px;display:grid;grid-template-columns:repeat(21,1fr)}.qq i{background:#000}.qq i.w{background:#fff}
.phn .ok{background:linear-gradient(135deg,#16a34a,#0e7a36);padding:12px;margin-top:6px}.phn .ok .D{font:400 34px/1 var(--disp);text-transform:uppercase;margin-top:6px}
.phn .ok .mono{color:#c7f5d6;font-size:10px}
.phn .ck{margin-top:10px;text-align:center;padding:13px;background:var(--g);font:700 15px var(--bc);letter-spacing:.16em;text-transform:uppercase}
.phn .kk{display:grid;grid-template-columns:1fr 1fr;gap:7px}.phn .kk div{background:#141418;border:1px solid #ffffff1a;padding:10px}.phn .kk b{display:block;font:400 40px/1 var(--disp)}
.phn .rw2{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid #ffffff14;font:600 15px var(--bc);letter-spacing:.06em;text-transform:uppercase}.phn .rw2 small{margin-left:auto;font:400 10px var(--mono);color:#8d8981}
.phn .av3{width:24px;height:24px;border-radius:50%;background:var(--g)}
footer{padding:36px max(24px,3.4vw) 60px;border-top:1px solid var(--line);color:var(--mut);font-size:13px}
.rv{opacity:0;transform:translateY(34px);transition:opacity .9s,transform .9s var(--ease)}.rv.in{opacity:1;transform:none}
body.adm #cur{display:none}
@media(max-width:860px){
 .pin{grid-template-columns:1fr;align-content:center;gap:10px;padding:68px 18px 14px}
 .hl .chip,.hs,.hb{display:none}h1.hh{margin:0;font-size:min(9.6vh,16vw)}.gtabs{display:flex;width:100%}.gsel{display:none}.gtabs button{flex:1;justify-content:center;padding:10px 6px;font-size:11px}.gtabs button i{display:none}
  .rc{max-width:none;gap:8px}.stw{padding:26px 0 0;--ph:clamp(30px,5vh,46px)}.hole{left:24%}
 .pl{padding:0 12px}.pl .tt{font-size:clamp(18px,3.6vh,28px)}.pl .pr{min-width:4.6em}.pl .pop{display:none!important}.pl .n{width:2em}
 .rc>.mono{display:none}.numw{opacity:.7;font-size:60vw;top:36%}
 .scr{display:none}
 #gyms{grid-template-columns:1fr}.hf{min-height:88vh}
 .steps{grid-template-columns:1fr;gap:34px}
 #visit{grid-template-columns:1fr}.vp{min-height:46vh}
 #team{grid-template-columns:1fr}.phs{height:470px}.phn{transform:none!important}.phn.a{left:50%;margin-left:-125px}.phn.b{display:none}
 .nv{display:none}
 #look .st{grid-template-columns:1fr;gap:10px;padding:68px 18px 50px;align-content:center}.gl-l h2{font-size:clamp(46px,13vw,70px);margin-bottom:8px}.gl-idx{display:none}.gl-l .mono{display:none}.gl-frame{height:44vh}.gl-th{grid-template-columns:repeat(8,1fr);gap:5px}
